[project]
name = "gbrain"
version = "0.1.0"
description = "Fondazione privata per un second brain autobiografico"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "fastapi==0.143.0",
  "neo4j==6.4.0",
  "procrastinate==3.10.0",
  "psycopg[binary,pool]==3.3.6",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy[asyncio]==2.1.4",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/gbrain"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["procrastinate.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
